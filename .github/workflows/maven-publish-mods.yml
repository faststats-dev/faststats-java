name: Maven Publish Mods
on:
  release:
    types: [ prereleased, released ]
jobs:
  build:
    name: Publish ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ fabric, forge, neoforge ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # cached by the Mavenizer steps, keyed by the Forge versions instead of every commit
          gradle-home-cache-excludes: caches/minecraftforge/forgegradle/mavenizer
      - name: Restore Forge Mavenizer cache
        if: matrix.platform == 'forge'
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/minecraftforge/forgegradle/mavenizer/caches
          key: mavenizer-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: mavenizer-
      - name: Publish with Gradle to Repository
        env:
          REPOSITORY_USER: ${{ secrets.REPOSITORY_USER }}
          REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_TOKEN }}
        run: ./gradlew publish -PmodPlatforms=${{ matrix.platform }} -p ${{ matrix.platform }}
