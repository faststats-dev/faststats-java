name: Build Mods
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ fabric, forge, neoforge ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # cached by the Mavenizer steps, keyed by the Forge versions instead of every commit
          gradle-home-cache-excludes: caches/minecraftforge/forgegradle/mavenizer
      - name: Restore Forge Mavenizer cache
        id: mavenizer
        if: matrix.platform == 'forge'
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/minecraftforge/forgegradle/mavenizer/caches
          key: mavenizer-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: mavenizer-
      - name: Build with Gradle
        run: ./gradlew build -PmodPlatforms=${{ matrix.platform }} -p ${{ matrix.platform }}
      - name: Save Forge Mavenizer cache
        if: matrix.platform == 'forge' && github.ref == 'refs/heads/main' && steps.mavenizer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/minecraftforge/forgegradle/mavenizer/caches
          key: mavenizer-${{ hashFiles('gradle/libs.versions.toml') }}
